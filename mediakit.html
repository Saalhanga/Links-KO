<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Media Kit | Kudahuvadhoo Online</title>
    <meta name="description" content="Media Kit | Kudahuvadhoo — statistics, reach metrics, and advertising rates.">

    <!-- Open Graph -->
    <meta property="og:title" content="Media Kit | Kudahuvadhoo Online">
    <meta property="og:description" content="Statistics, reach & ad rates for Kudahuvadhoo Online.">
    <meta property="og:image" content="./assets/logo-white.png">
    <meta property="og:type" content="website">

    <!-- Twitter/X Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Media Kit | Kudahuvadhoo Online">
    <meta name="twitter:description" content="Statistics, reach & ad rates for Kudahuvadhoo Online.">
    <meta name="twitter:image" content="./assets/logo-white.png">

    <link rel="icon" type="image/png" href="./assets/favicon.png">
    <style>
        :root {
            --red: #c0392b;
            --dot: rgba(255, 255, 255, .10);
            --ink: #3d3d3d;
            --label: #9aa1a8;
            --navy: #1d3b5c;
            --teal: #20b6ae;
            --teal-dark: #1c4c63;
            --cyan: #22b8c4;
            --orange: #eb9d3c;
            --pink: #e0505f;
            --gold: #e8b93b;
            --twitter: #1DA1F2;
            --facebook: #1877F2;
            --surface: #ffffff;
            --shadow-card: 0 8px 24px rgba(0, 0, 0, .10), 0 2px 8px rgba(0, 0, 0, .06);
            --shadow-elevated: 0 16px 40px rgba(0, 0, 0, .14), 0 4px 12px rgba(0, 0, 0, .08);
            --radius: 8px;
            --radius-lg: 12px;
            --transition-fast: 150ms ease;
            --transition-base: 250ms ease;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            -webkit-text-size-adjust: 100%;
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--red);
            color: var(--ink);
            line-height: 1.5;
            min-height: 100vh;
            overflow-x: hidden;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(.92); }
            to { opacity: 1; transform: scale(1); }
        }

        .cover {
            position: relative;
            min-height: 48vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 24px 56px;
            background: var(--red);
        }

        .cover-dots {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(var(--dot) 2.2px, transparent 2.2px);
            background-size: 16px 16px;
            pointer-events: none;
        }

        .wordmark-logo {
            position: relative;
            z-index: 1;
            max-width: 320px;
            max-height: 150px;
            width: auto;
            height: auto;
            display: inline-block;
            animation: scaleIn .7s ease both;
            will-change: transform;
        }

        .wrap {
            position: relative;
            padding: 32px 24px 0;
            min-height: 52vh;
        }
        .wrap-dots {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(var(--dot) 2.2px, transparent 2.2px);
            background-size: 16px 16px;
            pointer-events: none;
        }

        .card {
            position: relative;
            z-index: 1;
            max-width: 620px;
            margin: 0 auto 28px;
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 32px 28px;
            box-shadow: var(--shadow-card);
            border: 1px solid rgba(0, 0, 0, .04);
            animation: slideUp .6s ease both;
            transition: box-shadow var(--transition-base), transform var(--transition-fast);
            will-change: transform;
        }
        .card:hover {
            box-shadow: var(--shadow-elevated);
            transform: translateY(-2px);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 14px;
            border-bottom: 1px solid #eef0f2;
        }

        .card h2 {
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-size: .88rem;
            font-weight: 800;
            color: #333;
        }

        .card-meta {
            font-size: .72rem;
            color: var(--label);
            font-weight: 600;
            letter-spacing: .5px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px;
            border-radius: var(--radius);
            background: #fafbfc;
            transition: background var(--transition-fast), transform var(--transition-fast);
            will-change: transform;
        }
        .stat-item:hover {
            background: #f3f5f7;
            transform: translateY(-1px);
        }

        .icon-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            transition: transform var(--transition-fast);
            will-change: transform;
        }
        .icon-circle svg {
            width: 22px;
            height: 22px;
        }
        .stat-item:hover .icon-circle {
            transform: scale(1.06);
        }

        .icon-orange { background: var(--orange); }
        .icon-teal { background: var(--teal); }
        .icon-pink { background: var(--pink); }
        .icon-navy { background: var(--navy); }
        .icon-teal-dark { background: var(--teal-dark); }
        .icon-gold { background: var(--gold); }
        .icon-twitter { background: var(--twitter); }
        .icon-facebook { background: var(--facebook); }

        .slot .name .icon-navy,
        .slot .name .icon-pink,
        .slot .name .icon-teal-dark,
        .slot .name .icon-facebook {
            color: #fff;
        }

        .stat-label {
            font-size: .68rem;
            letter-spacing: 1px;
            color: var(--label);
            text-transform: uppercase;
            font-weight: 700;
        }
        .stat-value {
            font-size: 1.45rem;
            font-weight: 800;
            color: #333;
            margin-top: 1px;
            line-height: 1.2;
        }
        .stat-desc {
            font-size: .68rem;
            color: #999;
            font-weight: 500;
            margin-top: 1px;
        }

        .audience-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }
        .audience-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px;
            border-radius: var(--radius);
            background: #fafbfc;
            transition: background var(--transition-fast), transform var(--transition-fast);
            will-change: transform;
        }
        .audience-item:hover {
            background: #f3f5f7;
            transform: translateY(-1px);
        }
        .audience-item .icon-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            border: 2px solid currentColor;
            transition: transform var(--transition-fast);
            will-change: transform;
        }
        .audience-item:hover .icon-circle {
            transform: scale(1.06);
        }
        .audience-item .icon-circle svg {
            width: 22px;
            height: 22px;
        }
        .audience-label {
            font-size: .68rem;
            letter-spacing: 1px;
            color: var(--label);
            text-transform: uppercase;
            font-weight: 700;
        }
        .audience-value {
            font-size: 1.35rem;
            font-weight: 800;
            color: #333;
            margin-top: 1px;
            line-height: 1.2;
        }

        .timeline {
            position: relative;
            padding-top: 8px;
        }
        .timeline::before {
            content: "";
            position: absolute;
            left: 50%;
            top: 10px;
            bottom: 10px;
            width: 3px;
            background: #edf0f2;
            transform: translateX(-50%);
        }

        .slot {
            display: grid;
            grid-template-columns: 1fr 56px 1fr;
            align-items: center;
            margin-bottom: 18px;
            position: relative;
        }
        .slot:last-child {
            margin-bottom: 0;
        }

        .badge-num {
            grid-column: 2;
            justify-self: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            color: #fff;
            font-weight: 800;
            font-size: .88rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #fff;
            box-shadow: 0 3px 12px rgba(0, 0, 0, .18);
            position: relative;
            z-index: 1;
            transition: transform var(--transition-fast);
            will-change: transform;
        }
        .slot:hover .badge-num {
            transform: scale(1.08);
        }

        .slot .info {
            display: flex;
            flex-direction: column;
        }
        .slot .name {
            font-weight: 800;
            text-transform: uppercase;
            font-size: .88rem;
            color: #333;
        }
        .slot .detail {
            font-size: .72rem;
            color: var(--label);
            font-weight: 500;
            margin-top: 2px;
        }
        .slot .price {
            color: #555;
            font-weight: 700;
            margin-top: 4px;
            font-size: .92rem;
        }
        .slot.right .info {
            grid-column: 3;
            text-align: left;
            padding-left: 12px;
        }
        .slot.left .info {
            grid-column: 1;
            text-align: right;
            padding-right: 12px;
        }

        .contact-card {
            text-align: center;
            padding: 28px 32px;
            border-radius: var(--radius-lg);
            transition: background var(--transition-fast);
        }
        .contact-card:hover {
            background: #fafbfc;
        }
        .contact-card h2 {
            margin-bottom: 8px;
        }
        .contact-note {
            font-size: .85rem;
            color: #666;
            margin-bottom: 18px;
            max-width: 420px;
            margin-left: auto;
            margin-right: auto;
        }
        .contact-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--red);
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            font-size: .9rem;
            padding: 12px 26px;
            border-radius: var(--radius);
            box-shadow: 0 6px 18px rgba(192, 57, 43, .35);
            transition: transform var(--transition-fast), box-shadow var(--transition-fast);
        }
        .contact-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(192, 57, 43, .45);
        }
        .contact-btn:active {
            transform: scale(.97);
        }
        .contact-btn:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 3px;
            box-shadow: 0 0 0 4px rgba(192, 57, 43, .3);
        }
        .contact-btn svg {
             width: 18px;
             height: 18px;
         }
         .call-btn {
             background: #0d9488;
             box-shadow: 0 6px 18px rgba(13, 148, 136, .35);
         }
         .call-btn:hover {
             box-shadow: 0 10px 24px rgba(13, 148, 136, .45);
         }
         .call-btn:focus-visible {
             box-shadow: 0 0 0 4px rgba(13, 148, 136, .3);
         }
         .contact-btns {
             display: inline-flex;
             flex-wrap: wrap;
             gap: 12px;
             justify-content: center;
         }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: rgba(255, 255, 255, .88);
            text-decoration: none;
            font-weight: 700;
            font-size: .88rem;
            margin-bottom: 14px;
            transition: opacity var(--transition-fast), transform var(--transition-fast);
        }
        .back-link:hover {
            opacity: .75;
            transform: translateX(-2px);
        }
        .back-link:focus-visible {
            outline: 2px solid rgba(255, 255, 255, .6);
            outline-offset: 3px;
            border-radius: 4px;
        }
        .back-link svg {
            width: 18px;
            height: 18px;
        }

        .mk-footer {
            text-align: center;
            padding: 0 18px 40px;
            color: rgba(255, 255, 255, .75);
            font-size: .78rem;
            animation: slideUp .6s ease both;
            background-image: radial-gradient(var(--dot) 2.2px, transparent 2.2px);
            background-size: 16px 16px;
        }
        .mk-footer strong {
            color: #fff;
            font-weight: 700;
        }

        @media (max-width: 460px) {
            .cover {
                min-height: 48vh;
                padding: 36px 18px 56px;
            }
            .wordmark-logo {
                max-width: 320px;
                max-height: 150px;
            }
            .card {
                padding: 26px 18px;
            }
            .stats-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .audience-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .timeline::before {
                left: 20px;
            }
            .slot {
                grid-template-columns: 44px 1fr;
                gap: 0;
            }
            .badge-num {
                grid-column: 1;
                grid-row: 1;
                width: 40px;
                height: 40px;
                font-size: .78rem;
                border-width: 3px;
            }
            .slot.right .info,
            .slot.left .info {
                grid-column: 2;
                grid-row: 1;
                text-align: left;
                padding-left: 10px;
                padding-right: 0;
            }
            .slot .name,
            .slot .price,
            .slot .detail {
                font-size: .8rem;
            }
            .mk-footer {
                font-size: .72rem;
            }
        }

        @media (min-width: 640px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                max-width: 540px;
                margin-left: auto;
                margin-right: auto;
            }
            .audience-grid {
                grid-template-columns: repeat(2, 1fr);
                max-width: 540px;
                margin-left: auto;
                margin-right: auto;
            }
        }

        @media (min-width: 768px) {
            .cover {
                min-height: 50vh;
            }
            .wordmark-logo {
                max-width: 480px;
                max-height: 220px;
            }
            .card {
                padding: 32px 28px;
            }
            .stats-grid {
                grid-template-columns: repeat(3, 1fr);
                max-width: 620px;
            }
            .audience-grid {
                grid-template-columns: repeat(3, 1fr);
                max-width: 620px;
            }
        }

        @media print {
            body {
                background: #fff;
                color: #000;
            }
            .cover {
                min-height: auto;
                padding: 24px;
                background: #fff;
            }
            .cover-dots {
                display: none;
            }
            .wordmark-logo {
                max-height: 80px;
            }
            .wrap {
                padding: 16px;
                min-height: auto;
            }
            .wrap-dots {
                display: none;
            }
            .card {
                box-shadow: none;
                border: 1px solid #ddd;
                break-inside: avoid;
                animation: none;
            }
            .card:hover {
                box-shadow: none;
                transform: none;
            }
            .card h2 {
                color: #000;
            }
            .contact-btn {
                 background: #000;
                 color: #fff;
                 box-shadow: none;
                 border: 1px solid #000;
             }
             .call-btn {
                 background: #000;
                 color: #fff;
                 box-shadow: none;
                 border: 1px solid #000;
             }
            .mk-footer {
                color: #666;
                background-image: none;
            }
            .back-link {
                color: #333;
            }
            .slot:hover .badge-num {
                transform: none;
            }
            .stat-item:hover {
                background: #fafbfc;
                transform: none;
            }
            .contact-card:hover {
                background: transparent;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        ::selection {
            background: rgba(255, 255, 255, .35);
            color: #fff;
        }
    </style>
</head>
<body>

    <section class="cover">
        <div class="cover-dots" aria-hidden="true"></div>
        <img src="./assets/logo-white.png" alt="Kudahuvadhoo Online" class="wordmark-logo">
    </section>

    <section class="wrap">
        <main id="main">
        <div class="wrap-dots" aria-hidden="true"></div>
        <a class="back-link" href="./index.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to links
        </a>

        <div class="card" id="stats-card">
            <div class="card-header">
                <h2>Statistics</h2>
                <span class="card-meta" id="last-updated"></span>
            </div>
            <div class="stats-grid" id="stats-grid"></div>
        </div>

        <div class="card" id="audience-card">
            <div class="card-header">
                <h2>Audience Overview</h2>
                <span class="card-meta">Cross-Platform Reach</span>
            </div>
            <div class="audience-grid" id="audience-grid"></div>
        </div>

        <div class="card" id="adslots-card">
            <div class="card-header">
                <h2>Ad Slots</h2>
                <span class="card-meta">Monthly Rates</span>
            </div>
            <div class="timeline" id="adslots-timeline"></div>
        </div>

        <div class="card contact-card" id="contact-card">
            <h2>Get In Touch</h2>
            <p class="contact-note" id="contact-note"></p>
            <div class="contact-btns">
                <a class="contact-btn" id="contact-btn" href="mailto:kudahuvadhoo.mv@gmail.com">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                    Contact Us
                </a>
                <a class="contact-btn call-btn" id="call-btn" href="tel:+9607861051">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 20 16.92z"></path></svg>
                    Call us
                </a>
            </div>
        </div>
        </main>
    </section>

    <footer class="mk-footer">
        <p><strong>Kudahuvadhoo Online</strong> &copy; <span id="mediakit-year"></span> Kudahuvadhoo Media Pvt ltd. All rights reserved.</p>
        <p>Made with &#x2764;&#xFE0F; Saalhanga inc.</p>
    </footer>

    <script src="./data/mediakit-data.js"></script>
    <script>
        (function () {
            function renderStats() {
                const grid = document.getElementById('stats-grid');
                const updatedEl = document.getElementById('last-updated');
                if (!grid || typeof mediakitData === 'undefined') return;

                if (updatedEl && mediakitData.brand && mediakitData.brand.lastUpdated) {
                    updatedEl.textContent = 'Updated ' + mediakitData.brand.lastUpdated;
                }

                grid.innerHTML = '';
                mediakitData.stats.forEach(function (stat, i) {
                    const item = document.createElement('div');
                    item.className = 'stat-item';
                    item.style.animation = 'slideUp .5s ease ' + (i * 0.05) + 's both';

                    const colorClass = 'icon-' + stat.colorVar.replace(/[^a-z0-9]/gi, '');
                    const iconSvg = (typeof mediakitIcons !== 'undefined' && mediakitIcons[stat.icon])
                        ? mediakitIcons[stat.icon]
                        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/></svg>';

                    item.innerHTML =
                        '<div class="icon-circle ' + colorClass + '">' + iconSvg + '</div>' +
                        '<div>' +
                            '<div class="stat-label">' + escapeHtml(stat.label) + '</div>' +
                            '<div class="stat-value">' + escapeHtml(stat.value) + '</div>' +
                            (stat.description ? '<div class="stat-desc">' + escapeHtml(stat.description) + '</div>' : '') +
                        '</div>';

                    grid.appendChild(item);
                });
            }

            function renderAdSlots() {
                const timeline = document.getElementById('adslots-timeline');
                if (!timeline || typeof mediakitData === 'undefined') return;

                timeline.innerHTML = '';
                const slots = Array.isArray(mediakitData.adSlots) ? mediakitData.adSlots : [];
                if (!slots.length) {
                    timeline.innerHTML = '<p style="text-align:center;color:#9aa1a8;font-size:.85rem;">No ad slots available.</p>';
                    return;
                }

                slots.forEach(function (slot, i) {
                    const el = document.createElement('div');
                    const side = i % 2 === 0 ? 'right' : 'left';
                    el.className = 'slot ' + side;
                    el.style.animation = 'slideUp .5s ease ' + (i * 0.05) + 's both';

                    const colorClass = 'icon-' + slot.colorVar.replace(/[^a-z0-9]/gi, '');
                    const nameHtml = '<span class="' + colorClass + '">' + slot.name + '</span>';

                    el.innerHTML =
                        '<div class="badge-num ' + colorClass + '">' + String(slot.position).padStart(2, '0') + '</div>' +
                        '<div class="info">' +
                            '<div class="name">' + nameHtml + '</div>' +
                            (slot.detail ? '<div class="detail">' + escapeHtml(slot.detail) + '</div>' : '') +
                            '<div class="price">' + escapeHtml(slot.price) + '</div>' +
                        '</div>';

                    timeline.appendChild(el);
                });
            }

            function renderContact() {
                const noteEl = document.getElementById('contact-note');
                const btnEl = document.getElementById('contact-btn');
                const callBtn = document.getElementById('call-btn');
                if (typeof mediakitData === 'undefined' || !mediakitData.contact) return;

                if (noteEl && mediakitData.contact.note) {
                    noteEl.textContent = mediakitData.contact.note;
                }
                if (btnEl && mediakitData.contact.email) {
                    btnEl.href = 'mailto:' + mediakitData.contact.email;
                }
                if (callBtn && mediakitData.contact.phone) {
                    callBtn.href = 'tel:' + mediakitData.contact.phone;
                }
            }

            function renderAudience() {
                const grid = document.getElementById('audience-grid');
                if (!grid || typeof mediakitData === 'undefined') return;

                grid.innerHTML = '';
                const items = Array.isArray(mediakitData.audience) ? mediakitData.audience : [];
                if (!items.length) {
                    grid.innerHTML = '<p style="text-align:center;color:#9aa1a8;font-size:.85rem;">No audience data available.</p>';
                    return;
                }

                items.forEach(function (item, i) {
                    const el = document.createElement('div');
                    el.className = 'audience-item';
                    el.style.animation = 'slideUp .5s ease ' + (i * 0.05) + 's both';

                    const colorClass = 'icon-' + item.colorVar.replace(/[^a-z0-9]/gi, '');
                    const iconSvg = (typeof mediakitIcons !== 'undefined' && mediakitIcons[item.icon])
                        ? mediakitIcons[item.icon]
                        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/></svg>';

                    el.innerHTML =
                        '<div class="icon-circle ' + colorClass + '">' + iconSvg + '</div>' +
                        '<div>' +
                            '<div class="audience-label">' + escapeHtml(item.label) + '</div>' +
                            '<div class="audience-value">' + escapeHtml(item.value) + '</div>' +
                        '</div>';

                    const iconCircle = el.querySelector('.icon-circle');
                    if (iconCircle && item.brandColor) {
                        iconCircle.style.color = item.brandColor;
                        iconCircle.style.borderColor = item.brandColor;
                    }

                    grid.appendChild(el);
                });
            }

            function escapeHtml(str) {
                if (!str) return '';
                return str
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            }

            function init() {
                renderStats();
                renderAdSlots();
                renderAudience();
                renderContact();
                const yearEl = document.getElementById('mediakit-year');
                if (yearEl) yearEl.textContent = new Date().getFullYear();
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
